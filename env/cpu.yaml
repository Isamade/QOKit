name: qokit-cpu
channels:
  - conda-forge
dependencies:
  # --- core --------------------------------------------------------------
  - python =3.11
  - numpy  >=1.26
  - scipy  >=1.11
  - numba  >=0.59
  - qiskit-aer =0.13.*        # CPU-only build
  # --- dev / test -------------------------------------------------------
  - pytest
  - pandas
  - matplotlib
  - ipykernel                  # jupyter support
  - pip
  - pip:
      - -e .                   # editable install of QOKit
